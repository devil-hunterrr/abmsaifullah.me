<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maintenance</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --text:#e6e8f2;
  --muted:#b0b5c9;
  --accent:#8edb8e;
}

/* ===== BODY ===== */
body{
  margin:0;
  font-family:'Inter', sans-serif;

  background:
    linear-gradient(rgba(15,18,32,0.75), rgba(15,18,32,0.9)),
    url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2070&auto=format&fit=crop');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  color:var(--text);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* LIGHT RAYS */
.light-rays{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  opacity:0.25;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,200,0.25), transparent 40%),
    linear-gradient(120deg, transparent 30%, rgba(255,255,200,0.15), transparent 70%);
  animation:rays 12s ease-in-out infinite;
}
@keyframes rays{
  50%{transform:translateX(20px)}
}

/* FOG */
.fog{
  position:fixed;
  inset:0;
  z-index:1;
  opacity:0.15;
  background:radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
}

/* RAIN */
#rain{
  position:fixed;
  inset:0;
  z-index:2;
  opacity:0.25;
}

/* GRASS */
.grass{
  position:fixed;
  bottom:0;
  width:100%;
  height:120px;
  z-index:2;
  opacity:0.15;
}

/* UI */
.container{
  position:relative;
  z-index:3;
  width:min(900px,92%);
  padding:40px 28px;
  text-align:center;

  background:rgba(20,25,35,0.6);
  backdrop-filter:blur(10px);

  border-radius:16px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);

  animation:float 8s ease-in-out infinite;
}
@keyframes float{
  50%{transform:translateY(-6px)}
}

h1{
  font-family:'Orbitron', sans-serif;
  font-size:28px;
}

p{
  color:var(--muted);
}

.status{
  margin-top:20px;
  color:var(--muted);
}

.dot{
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
  display:inline-block;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{
  50%{opacity:1}
}

/* SOUND BUTTON */
#soundToggle{
  margin-top:20px;
  padding:8px 16px;
  border:none;
  border-radius:8px;
  background:rgba(255,255,255,0.1);
  color:#fff;
  cursor:pointer;
  font-size:13px;
}

footer{
  margin-top:30px;
  font-size:13px;
  color:var(--muted);
}

a{color:var(--accent);text-decoration:none;}

</style>
</head>

<body>

<div class="light-rays"></div>
<div class="fog"></div>
<canvas id="rain"></canvas>

<!-- GRASS -->
<svg class="grass" viewBox="0 0 1200 200">
  <path id="grassPath"
    d="M0,200 C200,140 400,180 600,150 C800,120 1000,170 1200,140 L1200,200 Z"
    fill="#6fbf73"/>
</svg>

<!-- AUDIO -->
<audio id="jungleAudio" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5f6b5f1b3f.mp3?filename=jungle-night-ambience-110624.mp3" type="audio/mpeg">
</audio>

<!-- UI -->
<div class="container">
  <h1>Website Under Maintenance</h1>
  <p>We’re upgrading the system. It will be back shortly.</p>

  <div class="status">
    <span class="dot"></span> System Updating...
  </div>

  <button id="soundToggle">🔇 Play Sound</button>

  <footer>
    © <span id="year"></span> abmsaifullah.me <br>
    <a href="https://www.instagram.com/abm_saifullah_/" target="_blank">Instagram</a>
  </footer>
</div>

<script>
/* YEAR */
document.getElementById('year').textContent = new Date().getFullYear();

/* RAIN */
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d');
let w,h;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let drops=[];
for(let i=0;i<80;i++){
  drops.push({
    x:Math.random()*w,
    y:Math.random()*h,
    l:Math.random()*20+10,
    ys:Math.random()*10+10
  });
}

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="rgba(180,220,255,0.5)";
  for(let d of drops){
    ctx.beginPath();
    ctx.moveTo(d.x,d.y);
    ctx.lineTo(d.x,d.y+d.l);
    ctx.stroke();
  }
}

function update(){
  for(let d of drops){
    d.y+=d.ys;
    if(d.y>h){
      d.y=-20;
      d.x=Math.random()*w;
    }
  }
}

function rain(){
  draw();
  update();
  requestAnimationFrame(rain);
}
rain();

/* GRASS */
const grass = document.getElementById('grassPath');
let t=0;

function animateGrass(){
  t+=0.01;
  let wv=Math.sin(t)*15;

  grass.setAttribute("d",
    `M0,200 C200,${140+wv} 400,${180-wv} 600,${150+wv}
     C800,${120-wv} 1000,${170+wv} 1200,${140-wv} L1200,200 Z`
  );

  requestAnimationFrame(animateGrass);
}
animateGrass();

/* AUDIO CONTROL */
const audio = document.getElementById('jungleAudio');
const btn = document.getElementById('soundToggle');

btn.addEventListener('click', ()=>{
  if(audio.paused){
    audio.volume = 0.4;
    audio.play();
    btn.innerText = "🔊 Sound On";
  } else {
    audio.pause();
    btn.innerText = "🔇 Muted";
  }
});

/* AUTOPLAY ON FIRST CLICK */
document.addEventListener('click', ()=>{
  if(audio.paused){
    audio.volume = 0.4;
    audio.play().catch(()=>{});
    btn.innerText = "🔊 Sound On";
  }
},{once:true});
</script>

</body>
</html>
