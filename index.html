<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CYBERPUNK SYSTEM — MAINTENANCE</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <style>
    :root{
      --neon-pink:#8b0000; /* dark red */
      --neon-cyan:#00f7ff;
      --neon-green:#39ff14;
      --bg:#02020a;
      --panel:rgba(8,10,22,0.82);
      --border:rgba(0,247,255,0.35);
      --muted:#7a7f9d;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:radial-gradient(circle at top, #0a0f2a, var(--bg) 65%);
      font-family:'Inconsolata', monospace;
      color:var(--neon-green);
      overflow:hidden;
    }

    /* ===== 3D CANVAS ===== */
    #scene{position:fixed; inset:0; z-index:0}

    /* ===== UI ===== */
    .ui{
      position:relative;
      z-index:3;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      perspective:1400px;
    }

    .terminal{
      width:min(1000px,94%);
      padding:28px;
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.8)), var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:
        0 0 0 rgba(0,0,0,0),
        0 0 0 rgba(0,0,0,0),
        0 80px 180px rgba(0,0,0,0.95);
      transform-style:preserve-3d;
      animation:float 7s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{transform:rotateX(0deg) rotateY(0deg) translateZ(0)}
      50%{transform:rotateX(3deg) rotateY(-3deg) translateZ(30px)}
    }

    .title{
      font-family:'Orbitron', sans-serif;
      font-weight:800;
      letter-spacing:2px;
      font-size:14px;
      color:var(--neon-cyan);
      text-shadow:0 0 0 rgba(0,0,0,0), 0 0 18px rgba(0,0,0,0.95);
      margin-bottom:18px;
    }

    .line{margin:4px 0}
    .muted{color:var(--muted)}

    .headline{
      margin:22px 0 14px;
      font-family:'Orbitron', sans-serif;
      font-size:26px;
      font-weight:800;
      letter-spacing:3px;
      color:var(--neon-pink);
      text-shadow:0 0 0 rgba(0,0,0,0), 0 0 18px rgba(0,0,0,0.95);
    }

    .cursor{
      display:inline-block;
      width:12px;
      height:22px;
      background:var(--neon-pink);
      margin-left:6px;
      animation:blink 1s steps(2,start) infinite;
      box-shadow:0 0 12px rgba(255,47,220,0.9);
    }

    @keyframes blink{50%{opacity:0}}

    footer{
      margin-top:26px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:13px;
      color:var(--muted);
    }

    .social a{
      width:42px;
      height:42px;
      border-radius:10px;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      color:var(--neon-cyan);
      text-decoration:none;
      box-shadow:0 0 18px rgba(0,0,0,0.9);
    }

    /* CRT scanlines */
    .scanlines{
      position:fixed;
      inset:0;
      background:linear-gradient(transparent 92%, rgba(0,0,0,0.35));
      background-size:100% 3px;
      pointer-events:none;
      z-index:4;
      opacity:0.4;
    }

    /* Glitch overlay */
    .glitch{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:2;
      animation:glitch 6s infinite;
    }

    @keyframes glitch{
      0%,92%,100%{opacity:0}
      93%{opacity:0.15}
      94%{opacity:0}
      95%{opacity:0.25}
      96%{opacity:0}
    }

    @media(max-width:600px){
      .headline{font-size:20px}
      .terminal{padding:20px}
    }
  </style>
</head>
<body>

  <canvas id="scene"></canvas>

  <div class="ui">
    <main class="terminal">

      <div class="title">NEURAL INTERFACE :: RESTRICTED</div>

      <div class="line muted">Initializing cybernet uplink…</div>
      <div class="line muted">Biometric hash verified</div>
      <div class="line muted">Access level: <span style="color:var(--neon-cyan)">OBSERVER</span></div>

      <div class="headline" id="typing"></div>

      <div class="line muted">Status: 503 — SYSTEM OFFLINE</div>
      <div class="line muted">Neural grid undergoing reconstruction</div>

      <footer>
        <div>&copy; <span id="year"></span> abmsaifullah.me</div>
        <div class="social">
          <a id="insta" href="#" target="_blank" aria-label="Instagram">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6" />
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
            </svg>
          </a>
        </div>
      </footer>

    </main>
  </div>

  <div class="glitch"></div>
  <div class="scanlines"></div>

  <script>
    /* ===== LINKS ===== */
    document.getElementById('insta').href = 'https://instagram.com/yourhandle';

    /* ===== YEAR ===== */
    document.getElementById('year').textContent = new Date().getFullYear();

    /* ===== TYPING ===== */
    const msg = 'THIS WEBSITE IS UNDER MAINTENANCE';
    const target = document.getElementById('typing');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    let i = 0;
    function type(){
      if(i <= msg.length){
        target.textContent = msg.slice(0,i);
        if(!target.contains(cursor)) target.appendChild(cursor);
        i++;
        setTimeout(type, 50);
      }
    }
    type();

    /* ===== THREE.JS CYBERPUNK SCENE ===== */
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x02020a, 80, 300);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 1, 1000);
    camera.position.z = 140;

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));

    // Neon grid floor
    const grid = new THREE.GridHelper(600, 80, 0x00f7ff, 0x00f7ff);
    grid.material.opacity = 0.15;
    grid.material.transparent = true;
    grid.position.y = -40;
    scene.add(grid);

    // Particles
    const geo = new THREE.BufferGeometry();
    const count = 3000;
    const pos = new Float32Array(count*3);
    for(let i=0;i<count*3;i++) pos[i] = (Math.random()-0.5)*500;
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const mat = new THREE.PointsMaterial({color:0x8b0000, size:1.3, transparent:true, opacity:0.7});
    const particles = new THREE.Points(geo, mat);
    scene.add(particles);

    function animate(){
      requestAnimationFrame(animate);
      grid.rotation.z += 0.0006;
      particles.rotation.y += 0.0009;
      particles.rotation.x += 0.0003;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
